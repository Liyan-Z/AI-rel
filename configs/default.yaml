# GulfEval default experiment config. Everything dataset-specific lives here so it can be
# fixed after running `gulfeval inspect` without touching code.
run_name: pilot
dataset:
  hf_name: MBZUAI/Dialectal-Arabic-MMLU
  # Layout A: one HF config per variant -> fill `variant_configs`.
  # Layout B: a single table with a column naming the variant -> set `variant_column`.
  variant_column: dialect
  variant_configs: {}
  split: test
  columns:                       # verified against the dataset card (single config, single `test` split)
    id: [domain, qid]            # qid is unique only WITHIN a domain, so the pair identifies a question
    subject: domain
    question: question
    choices: choices             # list of 4 strings
    choices_columns: null
    answer: answer               # 0-based index
variants: [ENG, MSA, UAE, KSA, EGY, SYR, MAG]
reference_variant: MSA           # flips are measured against this variant
health_subjects:                 # matched by normalised substring against the subject column
  - anatomy
  - clinical knowledge
  - college biology
  - college medicine
  - high school biology
  - medical genetics
  - nutrition
  - professional medicine
  - virology
  - human aging
model:
  backend: mock                  # mock | anthropic | openai | hf
  name: mock-model
  temperature: 0.0
  max_tokens: 8
prompt:
  instruction_language: en       # keep fixed across variants so only the question text varies
  option_labels: [A, B, C, D, E]
run:
  subset: health                 # health | all
  limit_per_variant: null        # set e.g. 200 for a cheap smoke test
  repeats: 1                     # >=2 on the health slice gives a sampling-noise baseline
  workers: 8
  seed: 0
stats:
  bootstrap_samples: 10000
